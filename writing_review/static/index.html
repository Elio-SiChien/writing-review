<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="review-token" content="__TOKEN__"><title>Writing Review · 写作复利</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><span class="eyebrow">LOCAL FIRST · WRITING MEMORY</span><h1>Writing Review <small>写作复利</small></h1></div><div id="status" role="status">正在载入</div></header>
<nav aria-label="文稿操作"><button id="open">打开文稿</button><input id="import" type="file" accept=".txt,.md,.json" hidden><select id="documents" aria-label="文稿与轮次"></select><label>场景 <select id="scope"><option value="introduction">学术引言</option><option value="abstract">摘要</option><option value="grant">基金</option><option value="report">报告</option><option value="general">通用</option></select></label><button id="plan" class="primary">请AI出修改方案</button></nav>
<div class="save-info"><details><summary>保存位置与备份</summary><code id="handoff-path">正在读取</code><button id="backup">下载本稿备份</button></details><button id="retry" hidden>重试保存</button><button id="recovery" hidden>下载未发送修改的恢复备份</button><button id="next-round" hidden>查看新稿</button></div>
<main><section class="manuscript"><div class="paperhead"><h2 id="title">载入文稿</h2><p id="round-note">批注自动保存，AI先出方案，经你批准后再修改。</p></div><div id="paragraphs"></div></section><aside><h2>批注 <span id="count">0</span></h2><p class="muted">最新意见在上方</p><div id="comments"></div></aside></main>
<dialog id="compose"><form method="dialog"><h2>添加批注</h2><blockquote id="selection"></blockquote><textarea id="comment-text" rows="6" placeholder="希望如何修改，为什么？"></textarea><div><button id="cancel-comment" value="cancel">取消</button><button id="save-comment" value="default">保存批注</button></div></form></dialog>
<dialog id="instructions"><h2>复制到当前AI聊天</h2><p>AI先出方案，你批准后再改稿和沉淀偏好。</p><textarea id="instruction-text" rows="10" readonly></textarea><button id="close-instructions">关闭</button></dialog>
<script src="app.js"></script></body></html>
